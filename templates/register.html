<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрация — ANIMORA</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,#291342,#0c0b13 65%);font-family:Arial,sans-serif;color:white;padding:20px}
.card{width:100%;max-width:420px;padding:35px;background:#171321;border:1px solid #49305f;border-radius:20px;box-shadow:0 15px 50px #0008}
.logo{text-align:center;color:#c58aff;font-size:32px;font-weight:bold;margin-bottom:10px}
h1{text-align:center;font-size:25px}
p{text-align:center;color:#aaa}
input{width:100%;padding:15px;margin-top:14px;border:1px solid #443452;border-radius:10px;background:#0e0c15;color:white;font-size:15px}
button{width:100%;padding:15px;margin-top:20px;border:0;border-radius:10px;background:#a34dff;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{background:#bd79ff}
a{color:#c58aff;text-decoration:none}
.message{color:#ff9d9d;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<div class="logo">ANIMORA</div>
<h1>Создать аккаунт</h1>
<p>Присоединяйся к миру аниме!</p>

{% with messages = get_flashed_messages() %}
{% for message in messages %}
<div class="message">{{ message }}</div>
{% endfor %}
{% endwith %}

<form method="POST">
<input type="email" name="email" placeholder="Электронная почта" required>
<input type="password" name="password" placeholder="Пароль (минимум 6 символов)" minlength="6" required>
<button type="submit">Зарегистрироваться</button>
</form>

<p>Уже есть аккаунт? <a href="/login">Войти</a></p>
<p><a href="/">← Вернуться в каталог</a></p>
</div>
</body>
</html>
