
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANIMORA — каталог аниме</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0c0b13;color:white;font-family:Arial,sans-serif}
header{padding:22px 6%;background:#15121f;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.logo{color:#bd72ff;font-size:27px;font-weight:bold;letter-spacing:2px}
nav a{color:#ddd;text-decoration:none;margin-left:20px}
nav a:hover{color:#bd72ff}
.hero{padding:65px 7%;background:linear-gradient(110deg,#24113c,#531c70)}
.hero h1{font-size:44px;margin:0 0 12px}
.hero p{color:#e1d3ee;font-size:17px}
main{padding:35px 6%;max-width:1500px;margin:auto}
.search{width:100%;padding:15px;margin:15px 0;border:1px solid #393044;border-radius:10px;background:#191622;color:white;font-size:16px}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0 25px}
.filters button{border:1px solid #49305f;background:#191622;color:#ddd;border-radius:20px;padding:9px 15px;cursor:pointer}
.filters button.active,.filters button:hover{background:#963fff;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px}
.card{position:relative;background:#191622;border:1px solid #30263c;border-radius:13px;overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-5px);border-color:#bd72ff}
.poster{height:235px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;background:linear-gradient(145deg,#28153d,#5b2677);font-size:21px;font-weight:bold;color:#fff;text-shadow:0 2px 8px #000}
.card:nth-child(3n) .poster{background:linear-gradient(145deg,#152a43,#4b367c)}
.card:nth-child(3n+1) .poster{background:linear-gradient(145deg,#461b3b,#8b356a)}
.card:nth-child(3n+2) .poster{background:linear-gradient(145deg,#173b3a,#386b73)}
.card h3{margin:13px 12px 6px;font-size:16px}
.card p{margin:0 12px 14px;color:#aaa;font-size:13px}
.favorite-btn{position:absolute;top:10px;right:10px;width:42px;height:42px;border:1px solid #ffffff40;border-radius:50%;background:#171321dd;color:white;font-size:25px;cursor:pointer;z-index:2}
.favorite-btn.active{color:#ff4d83}
.favorite-btn:disabled{opacity:.6}
#notice{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#24113c;border:1px solid #bd72ff;border-radius:10px;padding:13px 20px;display:none;z-index:10}
#counter{color:#aaa;margin:15px 0}
footer{text-align:center;padding:30px;color:#777}
@media(max-width:600px){.hero h1{font-size:34px}nav a{margin-left:10px}}
</style>
</head>
<body>

<header>
  <div class="logo">ANIMORA</div>
  <nav>
    <a href="/">Главная</a>
    <a href="#catalog">Каталог</a>
    <a href="/profile">👤 Профиль</a>
  </nav>
</header>

<section class="hero">
  <h1>Твой мир аниме</h1>
  <p>Открывай новые истории, находи любимые тайтлы и сохраняй их в избранное.</p>
</section>

<main id="catalog">
  <h2>Каталог аниме</h2>
  <input class="search" id="search" placeholder="🔍 Найти аниме..." oninput="renderAnime()">

  <div class="filters" id="filters">
    <button class="active" onclick="setGenre('Все',this)">Все</button>
    <button onclick="setGenre('Экшен',this)">Экшен</button>
    <button onclick="setGenre('Приключения',this)">Приключения</button>
    <button onclick="setGenre('Фэнтези',this)">Фэнтези</button>
    <button onclick="setGenre('Романтика',this)">Романтика</button>
    <button onclick="setGenre('Драма',this)">Драма</button>
    <button onclick="setGenre('Комедия',this)">Комедия</button>
    <button onclick="setGenre('Спорт',this)">Спорт</button>
  </div>

  <div id="counter"></div>
  <div class="grid" id="animeGrid"></div>
</main>

<div id="notice"></div>
<footer>© 2026 ANIMORA — мир аниме ❤️</footer>

<script>
const animeList = [
["demon-slayer","Клинок, рассекающий демонов","Экшен, Фэнтези"],
["naruto","Наруто","Экшен, Приключения"],
["one-piece","Ван-Пис","Приключения, Фэнтези"],
["attack-on-titan","Атака титанов","Экшен, Драма"],
["jujutsu-kaisen","Магическая битва","Экшен, Фэнтези"],
["pokemon","Покемон","Приключения, Фэнтези"],
["death-note","Тетрадь смерти","Драма, Триллер"],
["one-punch-man","Ванпанчмен","Экшен, Комедия"],
["my-hero-academia","Моя геройская академия","Экшен, Фэнтези"],
["tokyo-ghoul","Токийский гуль","Экшен, Драма"],
["fullmetal-alchemist","Стальной алхимик","Приключения, Фэнтези"],
["hunter-x-hunter","Охотник х Охотник","Приключения, Экшен"],
["bleach","Блич","Экшен, Приключения"],
["dragon-ball","Драконий жемчуг","Экшен, Приключения"],
["chainsaw-man","Человек-бензопила","Экшен, Фэнтези"],
["spy-family","Семья шпиона","Комедия, Экшен"],
["blue-lock","Синяя тюрьма","Спорт, Драма"],
["haikyuu","Волейбол!!","Спорт, Комедия"],
["your-name","Твоё имя","Романтика, Драма"],
["a-silent-voice","Форма голоса","Драма, Романтика"],
["horimiya","Хоримия","Романтика, Комедия"],
["fruits-basket","Корзинка фруктов","Романтика, Драма"],
["toradora","Торадора!","Романтика, Комедия"],
["suzume","Судзумэ, закрывающая двери","Приключения, Драма"],
["spirited-away","Унесённые призраками","Фэнтези, Приключения"],
["howls-moving-castle","Ходячий замок","Фэнтези, Романтика"],
["princess-mononoke","Принцесса Мононоке","Приключения, Фэнтези"],
["mob-psycho-100","Моб Психо 100","Экшен, Комедия"],
["dr-stone","Доктор Стоун","Приключения, Фэнтези"],
["black-clover","Чёрный клевер","Экшен, Фэнтези"],
["fairy-tail","Хвост феи","Приключения, Фэнтези"],
["re-zero","Re:Zero","Драма, Фэнтези"],
["sword-art-online","Мастера меча онлайн","Экшен, Фэнтези"],
["overlord","Повелитель","Экшен, Фэнтези"],
["no-game-no-life","Нет игры — нет жизни","Приключения, Комедия"],
["the-promised-neverland","Обещанный Неверленд","Драма, Триллер"],
["vinland-saga","Сага о Винланде","Экшен, Драма"],
["bungou-stray-dogs","Великий из бродячих псов","Экшен, Драма"],
["cowboy-bebop","Ковбой Бибоп","Приключения, Драма"],
["steins-gate","Врата Штейна","Драма, Фэнтези"],
["code-geass","Код Гиас","Драма, Экшен"],
["psycho-pass","Психопаспорт","Драма, Экшен"],
["violet-evergarden","Вайолет Эвергарден","Драма, Романтика"],
["made-in-abyss","Созданный в Бездне","Приключения, Фэнтези"],
["frieren","Провожающая в последний путь Фрирен","Фэнтези, Приключения"],
["oshi-no-ko","Звёздное дитя","Драма, Романтика"],
["solo-leveling","Поднятие уровня в одиночку","Экшен, Фэнтези"],
["kaiju-no-8","Кайдзю номер восемь","Экшен, Фэнтези"],
["wind-breaker","Ветролом","Экшен, Драма"],
["classroom-of-the-elite","Добро пожаловать в класс превосходства","Драма, Комедия"]
];

let selectedGenre = "Все";

function setGenre(genre,button){
  selectedGenre=genre;
  document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active'));
  button.classList.add('active');
  renderAnime();
}

function renderAnime(){
  const query=document.getElementById('search').value.toLowerCase().trim();
  const grid=document.getElementById('animeGrid');

  const filtered=animeList.filter(anime=>{
    const matchesName=anime[1].toLowerCase().includes(query);
    const matchesGenre=selectedGenre==='Все'||anime[2].includes(selectedGenre);
    return matchesName&&matchesGenre;
  });

  grid.innerHTML=filtered.map(anime=>`
    <div class="card" data-id="${anime[0]}">
      <button class="favorite-btn" onclick="toggleFavorite(event,this)"
        data-id="${anime[0]}"
        data-title="${anime[1]}"
        data-poster=""
        data-genre="${anime[2]}">♡</button>
      <div class="poster">${anime[1]}</div>
      <h3>${anime[1]}</h3>
      <p>${anime[2].replaceAll(', ',' · ')}</p>
    </div>
  `).join('');

  document.getElementById('counter').textContent=
    `Найдено аниме: ${filtered.length} из ${animeList.length}`;

  loadFavorites();
}

function showNotice(message){
  const notice=document.getElementById('notice');
  notice.textContent=message;
  notice.style.display='block';
  clearTimeout(window.noticeTimer);
  window.noticeTimer=setTimeout(()=>notice.style.display='none',2500);
}

async function loadFavorites(){
  try{
    const response=await fetch('/favorites/list',{credentials:'same-origin',cache:'no-store'});
    if(!response.ok)return;
    const result=await response.json();
    if(!result.success)return;

    document.querySelectorAll('.favorite-btn').forEach(button=>{
      const active=result.anime_ids.includes(button.dataset.id);
      button.classList.toggle('active',active);
      button.textContent=active?'♥':'♡';
    });
  }catch(error){
    console.error('Ошибка загрузки избранного:',error);
  }
}

async function toggleFavorite(event,button){
  event.preventDefault();
  event.stopPropagation();
  if(button.disabled)return;
  button.disabled=true;

  try{
    const response=await fetch('/favorites/toggle',{
      method:'POST',
      credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        anime_id:button.dataset.id,
        title:button.dataset.title,
        poster:button.dataset.poster,
        genre:button.dataset.genre
      })
    });

    const result=await response.json();

    if(!response.ok||!result.success){
      showNotice(result.message||'Не удалось изменить избранное');
      return;
    }

    button.classList.toggle('active',result.favorited);
    button.textContent=result.favorited?'♥':'♡';
    showNotice(result.favorited?'Добавлено в избранное ❤️':'Удалено из избранного');
  }catch(error){
    console.error(error);
    showNotice('Ошибка соединения. Попробуй ещё раз.');
  }finally{
    button.disabled=false;
  }
}

renderAnime();
</script>

</body>
</html>
