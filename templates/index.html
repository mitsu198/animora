let selectedGenre = "Все";

function setGenre(genre,button){
  selectedGenre=genre;
  document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active'));
  button.classList.add('active');
  renderAnime();
}

function renderAnime(){
  const query=document.getElementById('search').value.toLowerCase().trim();
  const grid=document.getElementById('animeGrid');

  const filtered=animeList.filter(anime=>{
    const matchesName=anime[1].toLowerCase().includes(query);
    const matchesGenre=selectedGenre==='Все'||anime[2].includes(selectedGenre);
    return matchesName&&matchesGenre;
  });

  grid.innerHTML=filtered.map(anime=>{
    const poster=posterCache[anime[0]]||'';
    return `
      <div class="card" data-id="${anime[0]}" role="link" tabindex="0" aria-label="Открыть ${anime[1]}">
        <button class="favorite-btn" onclick="toggleFavorite(event,this)"
          data-id="${anime[0]}"
          data-title="${anime[1]}"
          data-poster="${poster}"
          data-genre="${anime[2]}">♡</button>
        <div class="poster">
          ${poster?'<img src="'+poster+'" alt="'+anime[1]+'" loading="lazy" onerror="this.remove()">':''}
          <span>${anime[1]}</span>
        </div>
        <h3>${anime[1]}</h3>
        <p>${anime[2].replaceAll(', ',' · ')}</p>
      </div>
    `;
  }).join('');

  document.getElementById('counter').textContent=
    `Найдено аниме: ${filtered.length} из ${animeList.length}`;

  loadFavorites();
}

const POSTER_CACHE_KEY='animora_mal_posters_v1';
let posterCache={};
try{
  posterCache=JSON.parse(localStorage.getItem(POSTER_CACHE_KEY)||'{}')||{};
}catch(error){
  console.warn('Не удалось прочитать кэш обложек:',error);
}

function savePosterCache(){
  try{
    localStorage.setItem(POSTER_CACHE_KEY,JSON.stringify(posterCache));
  }catch(error){
    console.warn('Не удалось сохранить кэш обложек:',error);
  }
}

async function fetchAnimePoster(anime){
  const englishTitle=animeEnglishTitles[anime[0]]||anime[0].replaceAll('-',' ');
  const queries=[englishTitle,anime[0].replaceAll('-',' ')];
  const normalize=value=>(value||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  for(const query of [...new Set(queries)]){
    const url='https://api.tenrai.org/v1/anime?q='+encodeURIComponent(query)+'&limit=10&sfw=true';
    const response=await fetch(url,{headers:{'Accept':'application/json'}});
    if(!response.ok)throw new Error('Tenrai HTTP '+response.status);
    const result=await response.json();
    const entries=Array.isArray(result.data)?result.data:[];
    if(!entries.length)continue;
    const wanted=normalize(englishTitle);
    const exact=entries.find(item=>{
      const titles=[item.title,item.title_english,item.title_japanese,...(item.title_synonyms||[])];
      return titles.some(title=>normalize(title)===wanted);
    });
    const item=exact||entries[0];
    const image=item.images?.webp?.large_image_url
      ||item.images?.jpg?.large_image_url
      ||item.images?.webp?.image_url
      ||item.images?.jpg?.image_url
      ||'';
    if(image)return image;
  }
  return '';
}

async function loadAnimePosters(){
  const missing=animeList.filter(anime=>!posterCache[anime[0]]);
  let index=0;
  async function worker(){
    while(index<missing.length){
      const anime=missing[index++];
      try{
        const poster=await fetchAnimePoster(anime);
        if(poster){
          posterCache[anime[0]]=poster;
          document.querySelectorAll('.card[data-id="'+anime[0]+'"] .poster').forEach(container=>{
            container.innerHTML='<img src="'+poster+'" alt="'+anime[1]+'" loading="lazy"><span>'+anime[1]+'</span>';
          });
          document.querySelectorAll('.favorite-btn[data-id="'+anime[0]+'"]').forEach(button=>{
            button.dataset.poster=poster;
          });
          savePosterCache();
        }
      }catch(error){
        console.warn('Не удалось загрузить обложку '+anime[1]+':',error);
      }
    }
  }
  await Promise.all([worker(),worker(),worker()]);
}
function showNotice(message){
  const notice=document.getElementById('notice');
  notice.textContent=message;
  notice.style.display='block';
  clearTimeout(window.noticeTimer);
  window.noticeTimer=setTimeout(()=>notice.style.display='none',2500);
}

async function loadFavorites(){
  try{
    const response=await fetch('/favorites/list',{credentials:'same-origin',cache:'no-store'});
    if(!response.ok)return;
    const result=await response.json();
    if(!result.success)return;

    document.querySelectorAll('.favorite-btn').forEach(button=>{
      const active=result.anime_ids.includes(button.dataset.id);
      button.classList.toggle('active',active);
      button.textContent=active?'♥':'♡';
    });
  }catch(error){
    console.error('Ошибка загрузки избранного:',error);
  }
}

async function toggleFavorite(event,button){
  event.preventDefault();
  event.stopPropagation();
  if(button.disabled)return;
  button.disabled=true;

  try{
    const response=await fetch('/favorites/toggle',{
      method:'POST',
      credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        anime_id:button.dataset.id,
        title:button.dataset.title,
        poster:button.dataset.poster,
        genre:button.dataset.genre
      })
    });

    const result=await response.json();

    if(!response.ok||!result.success){
      showNotice(result.message||'Не удалось изменить избранное');
      return;
    }

    button.classList.toggle('active',result.favorited);
    button.textContent=result.favorited?'♥':'♡';
    showNotice(result.favorited?'Добавлено в избранное ❤️':'Удалено из избранного');
  }catch(error){
    console.error(error);
    showNotice('Ошибка соединения. Попробуй ещё раз.');
  }finally{
    button.disabled=false;
  }
}

document.getElementById('animeGrid').addEventListener('click',event=>{
  if(event.target.closest('.favorite-btn'))return;
  const card=event.target.closest('.card[data-id]');
  if(card)openAnimeCard(card.dataset.id);
});
document.getElementById('animeGrid').addEventListener('keydown',event=>{
  if(event.key!=='Enter'&&event.key!==' ')return;
  const card=event.target.closest('.card[data-id]');
  if(!card)return;
  event.preventDefault();
  openAnimeCard(card.dataset.id);
});
function openAnimeCard(id){
  const anime=animeList.find(item=>item[0]===id);
  if(!anime)return;
  const params=new URLSearchParams({id:anime[0],title:anime[1],genre:anime[2],poster:posterCache[anime[0]]||''});
  window.location.href='/anime?'+params.toString();
}
renderAnime();
loadAnimePosters();

<script>
(function(){
 const key='animora_site_theme';
 const allowed=['default','ocean','forest','rose','light'];
 function applyTheme(theme){
  const value=allowed.includes(theme)?theme:'default';
  if(value==='default')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',value);
  try{localStorage.setItem(key,value)}catch(e){}
  document.querySelectorAll('[data-theme-choice]').forEach(button=>{
   const active=button.dataset.themeChoice===value;
   button.classList.toggle('selected',active);
   button.setAttribute('aria-pressed',active?'true':'false');
  });
 }
 let saved='default';
 try{saved=localStorage.getItem(key)||'default'}catch(e){}
 applyTheme(saved);
 document.addEventListener('click',event=>{
  const button=event.target.closest('[data-theme-choice]');
  if(button)applyTheme(button.dataset.themeChoice);
 });
 window.animoraApplyTheme=applyTheme;
})();
</script>
