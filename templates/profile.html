
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой профиль — ANIMORA</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    background:#0c0b13;
    color:white;
    font-family:Arial,sans-serif;
}
header{
    padding:22px 7%;
    background:#171321;
    border-bottom:1px solid #342440;
}
.logo{
    color:#c58aff;
    font-size:29px;
    font-weight:bold;
}
main{
    max-width:750px;
    margin:45px auto;
    padding:20px;
}
.card{
    background:#171321;
    border:1px solid #49305f;
    border-radius:20px;
    padding:35px;
    text-align:center;
    box-shadow:0 15px 50px #0006;
}
.avatar{
    width:130px;
    height:130px;
    border-radius:50%;
    object-fit:cover;
    background:linear-gradient(135deg,#a34dff,#5420a0);
    border:3px solid #bd72ff;
    display:block;
    margin:0 auto 20px;
}
h1{color:#c58aff}
.email{
    color:#aaa;
    overflow-wrap:anywhere;
}
form{
    max-width:370px;
    margin:25px auto;
}
input[type=text],input[type=file]{
    width:100%;
    padding:13px;
    background:#0e0c15;
    border:1px solid #49305f;
    border-radius:10px;
    color:white;
    margin-bottom:12px;
}
button,a{
    display:inline-block;
    padding:13px 22px;
    border:0;
    border-radius:10px;
    text-decoration:none;
    background:#963fff;
    color:white;
    cursor:pointer;
    font-size:15px;
}
button{
    width:100%;
}
button:hover,a:hover{background:#b66cff}
.buttons{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:28px;
}
.secondary{background:#30223d}
.message{
    color:#d6a6ff;
    margin:12px 0;
}
.form-title{
    color:#c58aff;
    margin-bottom:12px;
}
</style>
</head>

<body>
<header>
    <div class="logo">ANIMORA</div>
</header>

<main>
<div class="card">

    {% if avatar_url %}
        <img class="avatar" src="{{ avatar_url }}" alt="Аватар">
    {% else %}
        <div class="avatar" style="display:flex;align-items:center;justify-content:center;font-size:55px">👤</div>
    {% endif %}

    <h1>{{ display_name }}</h1>
    <p class="email">{{ email }}</p>
    <p>Добро пожаловать в ANIMORA!</p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="action" value="update_name">
        <h3 class="form-title">Изменить имя пользователя</h3>
        <input
            type="text"
            name="display_name"
            placeholder="Новое имя"
            value="{{ display_name }}"
            minlength="2"
            maxlength="24"
            required
        >
        <button type="submit">Сохранить имя</button>
    </form>

    <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="action" value="upload_avatar">
        <h3 class="form-title">Изменить аватар</h3>
        <input
            type="file"
            name="avatar"
            accept="image/png,image/jpeg,image/webp,image/gif"
            required
        >
        <button type="submit">Загрузить аватар</button>
    </form>

    <div class="buttons">
        <a href="/">Открыть каталог</a>
        <a href="/logout" class="secondary">Выйти</a>
    </div>

</div>
</main>
</body>
</html>
