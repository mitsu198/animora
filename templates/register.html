<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрация — ANIMORA</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,#291342,#0c0b13 65%);font-family:Arial,sans-serif;color:white;padding:20px}
.card{width:100%;max-width:420px;padding:35px;background:#171321;border:1px solid #49305f;border-radius:20px;box-shadow:0 15px 50px #0008}
.logo{text-align:center;color:#c58aff;font-size:32px;font-weight:bold;margin-bottom:10px}
h1{text-align:center;font-size:25px}
p{text-align:center;color:#aaa}
input{width:100%;padding:15px;margin-top:14px;border:1px solid #443452;border-radius:10px;background:#0e0c15;color:white;font-size:15px}
button{width:100%;padding:15px;margin-top:20px;border:0;border-radius:10px;background:#a34dff;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{background:#bd79ff}
a{color:#c58aff;text-decoration:none}
.message{color:#ff9d9d;text-align:center;margin-top:12px}
@keyframes animoraGlobalFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}html[data-theme="sunset"]{--site-bg:#32142c;--site-panel:#49203b;--site-panel-2:#2a1728;--site-border:#a34b65;--site-accent:#ff9a62}html[data-theme="neon"]{--site-bg:#10102b;--site-panel:#1a2040;--site-panel-2:#14172f;--site-border:#386b83;--site-accent:#4fffe1}html[data-theme="lavender"]{--site-bg:#211735;--site-panel:#30234a;--site-panel-2:#251c39;--site-border:#5b4479;--site-accent:#d6a6ff}html[data-theme="custom"] body{background:linear-gradient(125deg,var(--custom-bg,#171321),var(--custom-panel,#241432),var(--custom-accent,#bd72ff),var(--custom-bg,#171321))!important;background-size:300% 300%!important;color:#fff!important}html[data-theme="custom"] body[data-animated="true"]{animation:animoraGlobalFlow 18s ease infinite}html[data-theme="custom"] header,html[data-theme="custom"] .card,html[data-theme="custom"] .anime-card,html[data-theme="custom"] .shelf-card,html[data-theme="custom"] .service-card,html[data-theme="custom"] .empty{background:var(--custom-panel,#241432)!important;border-color:var(--custom-accent,#bd72ff)!important;color:#fff!important}html[data-theme="custom"] h1,html[data-theme="custom"] h2,html[data-theme="custom"] .logo{color:var(--custom-accent,#bd72ff)!important}</style><style>
:root{--site-bg:#0c0b13;--site-panel:#171321;--site-panel-2:#100d17;--site-border:#49305f;--site-accent:#bd72ff;--site-text:#fff;--site-muted:#aaa}
html[data-theme="ocean"]{--site-bg:#08131e;--site-panel:#102234;--site-panel-2:#0b1a29;--site-border:#28516d;--site-accent:#55c7ef}
html[data-theme="forest"]{--site-bg:#0b1510;--site-panel:#14251b;--site-panel-2:#0e1c14;--site-border:#315b40;--site-accent:#78d69a}
html[data-theme="rose"]{--site-bg:#1b0d16;--site-panel:#2a1422;--site-panel-2:#1d1019;--site-border:#63334f;--site-accent:#ff8fbd}
html[data-theme="light"]{--site-bg:#eeeaf4;--site-panel:#fff;--site-panel-2:#f5f1fa;--site-border:#d8cce5;--site-accent:#8138c7;--site-text:#241b2c;--site-muted:#716779}
html[data-theme] body{background:var(--site-bg)!important;color:var(--site-text)}
html[data-theme] header,html[data-theme] .card,html[data-theme] .watch,html[data-theme] .anime-card,html[data-theme] .empty{background:var(--site-panel)!important;border-color:var(--site-border)!important;color:var(--site-text)}
html[data-theme] .stat,html[data-theme] input,html[data-theme] select,html[data-theme] .service-card,html[data-theme] .episode-item{background:var(--site-panel-2)!important;border-color:var(--site-border)!important;color:var(--site-text)}
html[data-theme] .logo,html[data-theme] h1,html[data-theme] .favorites-section h2,html[data-theme] .form-title{color:var(--site-accent)!important}
html[data-theme] p,html[data-theme] .email,html[data-theme] .stat span,html[data-theme] .sub,html[data-theme] .genre{color:var(--site-muted)}
html[data-theme] .profile-tag{background:var(--site-panel-2);border-color:var(--site-border);color:var(--site-accent)}
html[data-theme="light"] .hero{background:linear-gradient(110deg,#ded0ed,#cbb3e3);color:#241b2c}
html[data-theme="light"] .hero p,html[data-theme="light"] nav a,html[data-theme="light"] header a{color:#493a55}
html[data-theme="light"] .anime-info p{color:#716779}
html[data-theme="light"] .favorite-btn{background:#fff;color:#8138c7}
</style>
</head>
<body>
<div class="card">
<a class="logo" href="/" style="color:inherit;text-decoration:none">ANIMORA</a>
<h1>Создать аккаунт</h1>
<p>Присоединяйся к миру аниме!</p>

{% with messages = get_flashed_messages() %}
{% for message in messages %}
<div class="message">{{ message }}</div>
{% endfor %}
{% endwith %}

<form method="POST">
<input type="email" name="email" placeholder="Электронная почта" required>
<input type="password" name="password" placeholder="Пароль (минимум 6 символов)" minlength="6" required>
<button type="submit">Зарегистрироваться</button>
</form>

<p>Уже есть аккаунт? <a href="/login">Войти</a></p>
<p><a href="/">← Вернуться в каталог</a></p>
</div>
<script>
(function(){
 const key='animora_site_theme',customKey='animora_custom_theme',root=document.documentElement;
 const allowed=['default','ocean','forest','rose','light','sunset','neon','lavender','custom'];
 function applyTheme(theme){const value=allowed.includes(theme)?theme:'default';if(value==='default')root.removeAttribute('data-theme');else root.setAttribute('data-theme',value);try{localStorage.setItem(key,value)}catch(e){}}
 function applyCustom(data){root.style.setProperty('--custom-bg',data.bg||'#171321');root.style.setProperty('--custom-accent',data.accent||'#bd72ff');root.style.setProperty('--custom-panel',data.panel||data.bg||'#171321');document.body.dataset.animated=data.animated===false?'false':'true';try{localStorage.setItem(customKey,JSON.stringify(data))}catch(e){}applyTheme('custom')}
 let saved='default',custom={};try{saved=localStorage.getItem(key)||'default';custom=JSON.parse(localStorage.getItem(customKey)||'{}')||{}}catch(e){}
 if(saved==='custom')applyCustom(custom);else applyTheme(saved);
 window.animoraApplyTheme=applyTheme;window.animoraApplyCustomTheme=applyCustom;
})();
</script>
</body>
</html>
