<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='animora-redesign.css') }}">
<title>Регистрация — ANIMORA</title>
</head>
<body>
<div class="card">
<a class="logo" href="/" style="color:inherit;text-decoration:none">ANIMORA</a>
<h1>Создать аккаунт</h1>
<p>Зарегистрируйся по электронной почте и паролю</p>
{% with messages = get_flashed_messages() %}
{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
{% endwith %}
<form method="POST" autocomplete="on">
<input type="email" name="email" placeholder="Электронная почта" autocomplete="username" required>
<input type="password" name="password" placeholder="Пароль (минимум 8 символов)" autocomplete="new-password" minlength="8" required>
<input type="password" name="password_confirm" placeholder="Повтори пароль" autocomplete="new-password" minlength="8" required>
<button type="submit">Создать аккаунт</button>
</form>
<p>Уже есть аккаунт? <a href="/login">Войти</a></p>
<p><a href="/">← Вернуться в каталог</a></p>
</div>
</body>
</html>
