<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='animora-redesign.css') }}">
<title>Вход — ANIMORA</title>
</head>
<body>
<div class="card">
<a class="logo" href="/" style="color:inherit;text-decoration:none">ANIMORA</a>
<h1>С возвращением!</h1>
<p>Войди в аккаунт с помощью электронной почты и пароля</p>
{% with messages = get_flashed_messages() %}
{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
{% endwith %}
<form method="POST" autocomplete="on">
<input type="email" name="email" placeholder="Электронная почта" autocomplete="username" required>
<input type="password" name="password" placeholder="Пароль" autocomplete="current-password" required>
<button type="submit">Войти</button>
</form>
<p>Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
<p><a href="/">← Вернуться в каталог</a></p>
</div>
</body>
</html>
