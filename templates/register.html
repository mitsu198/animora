<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='animora-redesign.css') }}">
<title>Регистрация — ANIMORA</title>




<script>
(function(){
 try{
  localStorage.setItem('animora_site_theme','default');
  localStorage.removeItem('animora_custom_theme');
 }catch(e){}
 document.documentElement.removeAttribute('data-theme');
 document.documentElement.style.removeProperty('--custom-bg');
 document.documentElement.style.removeProperty('--custom-accent');
 document.documentElement.style.removeProperty('--custom-panel');
 if(document.body){document.body.removeAttribute('data-animated');}
})();
</script>
</head>
<body>
<div class="card">
<a class="logo" href="/" style="color:inherit;text-decoration:none">ANIMORA</a>
<h1>Создать аккаунт</h1>
<p>Присоединяйся к миру аниме!</p>

{% with messages = get_flashed_messages() %}
{% for message in messages %}
<div class="message">{{ message }}</div>
{% endfor %}
{% endwith %}

<form method="POST">
<input type="email" name="email" placeholder="Электронная почта" required>
<input type="password" name="password" placeholder="Пароль (минимум 6 символов)" minlength="6" required>
<button type="submit">Зарегистрироваться</button>
</form>

<p>Уже есть аккаунт? <a href="/login">Войти</a></p>
<p><a href="/">← Вернуться в каталог</a></p>
</div>

</body>
</html>
